# nfpm configuration for generating .deb and .rpm packages (GUI version)
# https://nfpm.goreleaser.com/configuration/

name: suve
arch: "${GOARCH}"
platform: linux
version: "${VERSION}"
release: "1"
maintainer: "mpyw <mpyw628@gmail.com>"
description: |
  Git-like CLI/GUI for AWS Parameter Store and Secrets Manager
  .
  Provides familiar commands like show, log, diff, and a staging workflow
  for safe, reviewable changes to your AWS secrets and parameters.
  .
  This package includes GUI support via the --gui flag.
  Requires the GTK and WebKitGTK runtime libraries (GTK4 and webkitgtk-6.0;
  GTK3 and webkit2gtk-4.1 for the suve_webkit2_41 package).
homepage: "https://github.com/mpyw/suve"
license: "MIT"

vendor: "mpyw"
section: "utils"
priority: "optional"

rpm:
  group: "Applications/System"

depends: []

# GUI dependencies - recommended but not strictly required
# Package names are set per variant by the release workflow
recommends:
  - ${GTK_DEB}
  - ${WEBKIT_DEB}

overrides:
  rpm:
    recommends:
      - ${GTK_RPM}
      - ${WEBKIT_RPM}

conflicts:
  - suve-cli

contents:
  - src: ./suve
    dst: /usr/bin/suve
    file_info:
      mode: 0755

  - src: ./LICENSE
    dst: /usr/share/doc/suve/copyright
    file_info:
      mode: 0644
