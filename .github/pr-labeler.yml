# PR labeler configuration for actions/labeler
# Labels are applied based on changed file paths

cli:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/cli/**"
          - "cmd/suve/**"

gui:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/gui/**"

staging:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/staging/**"
          - "internal/usecase/staging/**"

param:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/cli/commands/aws/param/**"
          - "internal/cli/commands/azure/param/**"
          - "internal/provider/aws/param/**"
          - "internal/provider/azure/appconfig/**"
          - "internal/usecase/param/**"
          - "internal/version/awsparamversion/**"
          - "internal/version/azureappconfigversion/**"

secret:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/cli/commands/aws/secret/**"
          - "internal/cli/commands/azure/secret/**"
          - "internal/cli/commands/gcloud/**"
          - "internal/provider/aws/secret/**"
          - "internal/provider/azure/keyvault/**"
          - "internal/provider/gcloud/**"
          - "internal/usecase/secret/**"
          - "internal/version/awssecretversion/**"
          - "internal/version/azurekvversion/**"
          - "internal/version/gcloudversion/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/*.yml"

go:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.go"
          - "go.mod"
          - "go.sum"

javascript:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/gui/frontend/**/*.ts"
          - "internal/gui/frontend/**/*.svelte"
          - "internal/gui/frontend/package*.json"
