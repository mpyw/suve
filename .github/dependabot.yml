version: 2
updates:
  # gui/ is a separate module (the GUI entry point) that replaces the root with
  # ../; it must be bumped too or its go.mod falls behind and is no longer tidy.
  - package-ecosystem: gomod
    directories: ["/", "/gui"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # wails/v3, the @wailsio/runtime npm package, and the wails3 CLI pin in
    # mise.toml share one version and the committed bindings come from that
    # CLI, so they are bumped together by hand (see the gui-change skill).
    ignore:
      - dependency-name: "github.com/wailsapp/wails/v3"
    groups:
      wailsapp:
        patterns: ["github.com/wailsapp/*"]
        update-types: ["minor", "patch"]
      go-minor:
        patterns: ["*"]
        exclude-patterns: ["github.com/wailsapp/*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /internal/gui/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Bumped by hand together with github.com/wailsapp/wails/v3 (see gomod above).
    ignore:
      - dependency-name: "@wailsio/runtime"
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
