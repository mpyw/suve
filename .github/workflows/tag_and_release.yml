name: Tag and Release

# Show the target version in the run title, e.g. "Tag and Release v1.2.3".
run-name: "Tag and Release ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  # Passed down to the npm publish in release.yml. A called workflow cannot ask
  # for more than its caller was given.
  id-token: write

jobs:
  tag:
    uses: ./.github/workflows/tag.yml
    with:
      version: ${{ inputs.version }}

  release:
    needs: [tag]
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
