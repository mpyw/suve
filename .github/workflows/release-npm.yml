name: Release npm

# Show the target version in the run title, e.g. "Release npm v1.2.3".
run-name: "${{ inputs.check_only && 'npm check via Release npm' || format('Release npm {0}', inputs.version) }}"

# Normally called by release.yml after the GitHub Release exists. Dispatch it
# directly to retry a failed npm publish. npm-publish.sh skips packages that are
# already published, so a retry completes the set.
#
# npm trusted publishing (OIDC) matches the top-level workflow filename, not
# this file when it is called. Each npm package therefore has three trusted
# publishers: tag_and_release.yml, release.yml and release-npm.yml, each with
# the `release` environment. Adding a
# new entry point means adding it on npmjs.com too. Dispatch an entry point
# with check_only to check its registration without publishing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish to npm (e.g., v1.2.3) - GitHub release must already exist. Leave empty with check_only."
        required: false
        type: string
      check_only:
        description: "Only check npm trusted publishing. Tag, build and publish nothing."
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Version to publish to npm (e.g., v1.2.3) - GitHub release must already exist"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ===========================================================================
  # check_only: check npm trusted publishing for this entry point, and stop
  # ===========================================================================
  npm-check:
    if: inputs.check_only
    uses: ./.github/workflows/npm-check.yml
    permissions:
      contents: read
      id-token: write

  # ===========================================================================
  # Validate that the tag exists before publishing. publish-npm needs it, so
  # skipping it with check_only skips the publish.
  # ===========================================================================
  validate:
    if: ${{ !inputs.check_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format '$VERSION'"
            echo "Expected format: vX.Y.Z (e.g., v1.2.3)"
            exit 1
          fi
          echo "Version format valid: $VERSION"

      - name: Check tag exists
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --tags https://github.com/${{ github.repository }} | grep -q "refs/tags/${VERSION}$"; then
            echo "Error: Tag '$VERSION' does not exist"
            echo "Please create the tag first using the 'Tag' workflow"
            exit 1
          fi
          echo "Tag exists: $VERSION"

  # ===========================================================================
  # Publish to npm: no rebuild. Publish from the tag's already-released
  # binaries (downloaded from its GitHub Release), using the current tooling
  # from this workflow's ref.
  # ===========================================================================
  publish-npm:
    needs: [validate]
    runs-on: ubuntu-latest
    # The npm trusted publishers name this environment. A token exchange
    # from any other environment is refused.
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance / OIDC trusted publishing
    steps:
      # Default checkout ref = the ref this workflow runs on (current main), so
      # .github/npm and the publish script are the current tooling — not the tag.
      # This is the same effect as the release job's "restore npm tooling from
      # the workflow ref" overlay: an older tag (created before npm support) can
      # still be published with the current tooling.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: "22"

      # npm-publish.sh publishes seven packages one by one. A wrong trusted
      # publisher would stop it halfway, so check every package first.
      - name: List npm packages
        id: packages
        run: echo "names=$(jq -r .name .github/npm/*/package.json | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Check npm trusted publishing
        uses: mpyw/npm-oidc-check-action@14e783b7a6c7678a725bf255cbbd4e1516b13fa3 # v1.0.0
        with:
          packages: ${{ steps.packages.outputs.names }}

      - name: Download released archives for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          mkdir -p .github/releases
          # Only the archives npm-publish.sh consumes: macOS/Windows self-contained
          # builds and the Linux CLI-only static build.
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            -D .github/releases \
            -p 'suve_*_darwin_*.tar.gz' \
            -p 'suve_*_windows_*.zip' \
            -p 'suve-cli_*_linux_*.tar.gz'
          ls -la .github/releases

      - name: Publish to npm
        env:
          TAG: ${{ inputs.version }}
        run: |
          # Tokenless OIDC trusted publishing (id-token: write); provenance auto.
          # A recent npm is required for both. Each package must have a trusted
          # publisher configured on npmjs.com (owner mpyw/suve, this workflow).
          npm install -g npm@latest
          .github/scripts/npm-publish.sh "${TAG#v}"
