# declscope holds each declaration to the file that declares it.
# https://github.com/mpyw/declscope
rules:
  naming:
    # Ask for the namespace in a name once the package has a second one.
    qualify: ondemand
    # Reach exported declarations too. Inside the package they are read as bare
    # as any other name, so the namespace is wanted at the same call sites.
    exported: true

exclude:
  # The TUI pages are Bubble Tea models: one Model per page, its state in one
  # struct and its behaviour spread over update / view / cmds / mouse files.
  # browser holds 45 fields and 81 methods across seven files, and every pair
  # of those files references the other, so the file boundaries organise the
  # code without dividing it into units. declscope has nothing to check there
  # that is not already one unit.
  #
  # This is a statement about the layout, not a suppression. Removing the line
  # reports what it always reported, and anything outside the TUI is checked.
  - "internal/tui/**"
