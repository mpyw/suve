# declscope holds each declaration to the file that declares it.
# https://github.com/mpyw/declscope
rules:
  naming:
    # Ask for the namespace in a name once the package has a second one.
    qualify: ondemand
    # Reach exported declarations too. Inside the package they are read as bare
    # as any other name, so the namespace is wanted at the same call sites.
    exported: true

exclude:
  # Two pages are each one Bubble Tea Model: the state in one struct and the
  # behaviour spread over update / view / mouse / cmds files that all reference
  # one another. browser holds 45 fields and 81 methods across seven files.
  # The file boundaries organise that code without dividing it into units, so
  # there is nothing here for declscope to check that is not already one unit.
  #
  # Only these two. The rest of internal/tui is checked: dialogs is a hub
  # reading its parts, the root is mostly tests sitting outside their subject's
  # namespace, and data / components are ordinary renames. Excluding the whole
  # tree would have thrown away 639 tractable diagnostics to avoid 519.
  - "internal/tui/pages/browser/**"
  - "internal/tui/pages/staging/**"
